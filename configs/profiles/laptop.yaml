processors:
  resource/laptop:
    attributes:
      - key: asset.type
        value: laptop
        action: upsert

      - key: deployment.environment
        value: homelab
        action: upsert

service:
  pipelines:
    metrics:
      processors:
        [
          memory_limiter,
          resource/agent_identity,
          resource/laptop,
          batch,
        ]

    logs:
      processors:
        [
          memory_limiter,
          resource/agent_identity,
          resource/laptop,
          batch,
        ]

    traces:
      processors:
        [
          memory_limiter,
          resource/agent_identity,
          resource/laptop,
          batch,
        ]