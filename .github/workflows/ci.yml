name: CI

on:
  push:
    branches: [main, dev, chore/v0.1.4a-next]
  pull_request:
    branches: [main, dev, 'feat/**', chore/v0.1.4a-next]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Probe pinned Collector capability manifest
        shell: pwsh
        run: |
          $version = '0.160.0'
          if ($IsWindows) {
            $archive = "otelcol-contrib_${version}_windows_amd64.tar.gz"
            $expected = 'd8de67cf9dc3ffe928610d52b192cb029365bb42dc79a23e0586c040c83293cf'
            $binary = 'otelcol-contrib.exe'
            $tar = 'tar.exe'
          } else {
            $archive = "otelcol-contrib_${version}_linux_amd64.tar.gz"
            $expected = '7bb60c584c241c86261c2b8697cd3725dd8c56691f5ad5d98454eaa005b47b0c'
            $binary = 'otelcol-contrib'
            $tar = 'tar'
          }
          $collectorDir = Join-Path $env:RUNNER_TEMP 'otelcol'
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          New-Item -ItemType Directory -Force -Path $collectorDir | Out-Null
          $url = "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v$version/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned Collector archive checksum mismatch: $actual" }
          Push-Location $env:RUNNER_TEMP
          try {
            & $tar -xzf $archive -C $collectorDir $binary
            if ($LASTEXITCODE -ne 0) { throw "Collector archive extraction failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $binaryPath = Join-Path $collectorDir $binary
          $versionOutput = & $binaryPath --version 2>&1
          if ($LASTEXITCODE -ne 0 -or ($versionOutput -join ' ') -notmatch 'version 0\.160\.0') {
            throw "Unexpected Collector binary identity: $($versionOutput -join ' ')"
          }
          $inventoryPath = Join-Path $collectorDir 'components.yaml'
          & $binaryPath components 2>&1 | Set-Content -LiteralPath $inventoryPath
          if ($LASTEXITCODE -ne 0) { throw "Collector component inventory failed: $LASTEXITCODE" }
          "OTELCOL_CONTRIB_BINARY=$binaryPath" | Add-Content $env:GITHUB_ENV
          "AR_IMMS_PR05_COLLECTOR_BINARY=$binaryPath" | Add-Content $env:GITHUB_ENV
          "OTELCOL_ARTIFACT_SHA256=$actual" | Add-Content $env:GITHUB_ENV

      - name: Download and verify pinned OpAMP Supervisor
        shell: pwsh
        run: |
          if ($IsWindows) {
            $name = 'opampsupervisor_0.160.0_windows_amd64.exe'
            $expected = 'df2dfae96d6b711db31675d2deb8493d3dbada8561b25fe575fd90bd7cac8449'
          } else {
            $name = 'opampsupervisor_0.160.0_linux_amd64'
            $expected = '7967e3210e0252f25f41a96b15758dd2e03feb0aecbe85a945f1e2e6e71865c9'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'opampsupervisor'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $binaryPath = Join-Path $directory $name
          $url = "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/cmd%2Fopampsupervisor%2Fv0.160.0/$name"
          Invoke-WebRequest -Uri $url -OutFile $binaryPath
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $binaryPath).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned Supervisor checksum mismatch: $actual" }
          if (-not $IsWindows) { chmod 755 $binaryPath; if ($LASTEXITCODE -ne 0) { throw 'Could not mark Supervisor executable' } }
          # The pinned Supervisor binary does not implement a --version flag;
          # the official release URL plus the verified executable digest is its identity.
          "AR_IMMS_PR07A_SUPERVISOR_BINARY=$binaryPath" | Add-Content $env:GITHUB_ENV
          "OPAMPSUPERVISOR_ARTIFACT_SHA256=$actual" | Add-Content $env:GITHUB_ENV

      - name: Check architecture boundaries and production Go file size
        shell: pwsh
        run: ./scripts/check-architecture.ps1

      - name: Start isolated Docker Engine for PR-05 recovery E2E
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $socketDirectory = Join-Path $env:RUNNER_TEMP 'arimms-pr05-dind'
          $dataDirectory = Join-Path $env:RUNNER_TEMP 'arimms-pr05-dind-data'
          New-Item -ItemType Directory -Force -Path $socketDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $dataDirectory | Out-Null
          $manager = 'arimms-pr05-dind'
          docker run --privileged --detach --name $manager --network host --volume "${socketDirectory}:/run/host" --volume "${dataDirectory}:/var/lib/docker" docker:29.5.3-dind --host=unix:///run/host/docker.sock --host=tcp://127.0.0.1:2375
          if ($LASTEXITCODE -ne 0) { throw 'Could not start isolated Docker-in-Docker test daemon' }
          $socket = Join-Path $socketDirectory 'docker.sock'
          $dockerHost = "unix://$socket"
          $ready = $false
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            if (Test-Path -LiteralPath $socket) {
              docker exec $manager chmod 666 /run/host/docker.sock
            }
            docker --host $dockerHost info *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { docker logs $manager; throw 'Isolated Docker Engine did not become ready' }
          "AR_IMMS_PR05_FIXTURE_DOCKER_HOST=$dockerHost" | Add-Content $env:GITHUB_ENV
          "AR_IMMS_DOCKER_DISCOVERY_ENDPOINT=$dockerHost" | Add-Content $env:GITHUB_ENV
          "AR_IMMS_PR05_ISOLATED_DOCKER_MANAGER=$manager" | Add-Content $env:GITHUB_ENV

      - name: Test
        run: go test ./... -count=1

      - name: Live Docker/Collector/OTLP profile E2E
        if: runner.os == 'Linux'
        env:
          AR_IMMS_PR05_NATIVE_RUNTIME_E2E: '1'
          AR_IMMS_PR05_COLLECTOR_BINARY: ${{ env.OTELCOL_CONTRIB_BINARY }}
        run: go test ./cmd/agentctl -run '^TestLiveNativeDockerRedisProfileDeliversOTLP$' -count=1 -v

      - name: Live Docker application profile E2E
        if: runner.os == 'Linux'
        env:
          AR_IMMS_PR06_APPLICATION_PROFILE_E2E: '1'
          AR_IMMS_PR05_COLLECTOR_BINARY: ${{ env.OTELCOL_CONTRIB_BINARY }}
        run: go test ./cmd/agentctl -run '^TestLiveDockerApplicationProfilesDeliverOTLP$' -count=1 -v

      - name: Agent-managed Supervisor fallback and OTLP E2E
        env:
          AR_IMMS_PR07C_RUNTIME_E2E: '1'
          AR_IMMS_PR07C_EVIDENCE_DIR: ${{ runner.temp }}/pr07c-evidence
        run: go test ./internal/agentlifecycle -run '^TestManagedSupervisorRuntimeDeliversOTLP$' -count=1 -v

      - name: Upload PR-07c runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr07c-managed-supervisor-${{ runner.os }}
          path: ${{ runner.temp }}/pr07c-evidence/
          if-no-files-found: warn

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Remove isolated Docker Engine
        if: always() && runner.os == 'Linux'
        shell: pwsh
        run: docker rm --force arimms-pr05-dind
