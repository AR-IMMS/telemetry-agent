name: CI

on:
  push:
    branches: [main, dev, chore/v0.1.4a-next]
  pull_request:
    branches: [main, dev, 'feat/**', chore/v0.1.4a-next]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Probe pinned Collector capability manifest
        shell: pwsh
        run: |
          $version = '0.160.0'
          if ($IsWindows) {
            $archive = "otelcol-contrib_${version}_windows_amd64.tar.gz"
            $expected = 'd8de67cf9dc3ffe928610d52b192cb029365bb42dc79a23e0586c040c83293cf'
            $binary = 'otelcol-contrib.exe'
            $tar = 'tar.exe'
          } else {
            $archive = "otelcol-contrib_${version}_linux_amd64.tar.gz"
            $expected = '7bb60c584c241c86261c2b8697cd3725dd8c56691f5ad5d98454eaa005b47b0c'
            $binary = 'otelcol-contrib'
            $tar = 'tar'
          }
          $collectorDir = Join-Path $env:RUNNER_TEMP 'otelcol'
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          New-Item -ItemType Directory -Force -Path $collectorDir | Out-Null
          $url = "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v$version/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned Collector archive checksum mismatch: $actual" }
          Push-Location $env:RUNNER_TEMP
          try {
            & $tar -xzf $archive -C $collectorDir $binary
            if ($LASTEXITCODE -ne 0) { throw "Collector archive extraction failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $binaryPath = Join-Path $collectorDir $binary
          $versionOutput = & $binaryPath --version 2>&1
          if ($LASTEXITCODE -ne 0 -or ($versionOutput -join ' ') -notmatch 'version 0\.160\.0') {
            throw "Unexpected Collector binary identity: $($versionOutput -join ' ')"
          }
          $inventoryPath = Join-Path $collectorDir 'components.yaml'
          & $binaryPath components 2>&1 | Set-Content -LiteralPath $inventoryPath
          if ($LASTEXITCODE -ne 0) { throw "Collector component inventory failed: $LASTEXITCODE" }
          "OTELCOL_CONTRIB_BINARY=$binaryPath" | Add-Content $env:GITHUB_ENV
          "OTELCOL_ARTIFACT_SHA256=$actual" | Add-Content $env:GITHUB_ENV

      - name: Check architecture boundaries and production Go file size
        shell: pwsh
        run: ./scripts/check-architecture.ps1
      - name: Test
        run: go test ./... -count=1

      - name: Live Docker/Collector/OTLP profile E2E
        if: runner.os == 'Linux'
        env:
          AR_IMMS_PR05_NATIVE_RUNTIME_E2E: '1'
          AR_IMMS_PR05_COLLECTOR_BINARY: ${{ env.OTELCOL_CONTRIB_BINARY }}
        run: go test ./cmd/agentctl -run '^TestLiveNativeDockerRedisProfileDeliversOTLP$' -count=1 -v

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
