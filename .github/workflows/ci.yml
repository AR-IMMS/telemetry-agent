name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Probe pinned Collector capability manifest
        shell: bash
        run: |
          version=0.160.0
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            runner_temp="$RUNNER_TEMP"
            archive="otelcol-contrib_${version}_linux_amd64.tar.gz"
            expected="7bb60c584c241c86261c2b8697cd3725dd8c56691f5ad5d98454eaa005b47b0c"
            binary="otelcol-contrib"
            binary_path="$runner_temp/otelcol/$binary"
          else
            runner_temp="$(cygpath -u "$RUNNER_TEMP")"
            archive="otelcol-contrib_${version}_windows_amd64.tar.gz"
            expected="d8de67cf9dc3ffe928610d52b192cb029365bb42dc79a23e0586c040c83293cf"
            binary="otelcol-contrib.exe"
            binary_path="$(cygpath -w "$runner_temp/otelcol/$binary")"
          fi
          url="https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${version}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "$runner_temp/$archive"
          echo "$expected  $runner_temp/$archive" | sha256sum --check --status
          mkdir -p "$runner_temp/otelcol"
          tar -xzf "$runner_temp/$archive" -C "$runner_temp/otelcol"
          echo "OTELCOL_CONTRIB_BINARY=$binary_path" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
