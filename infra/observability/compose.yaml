name: ar-imms-observability

services:
  otel-gateway:
    image: otel/opentelemetry-collector:0.160.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    restart: unless-stopped
    ports:
      # Operational health is not exposed to the LAN.
      - "127.0.0.1:${GATEWAY_HEALTH_PORT}:13133"
    volumes:
      - ./otel-gateway/gateway-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - observability

  otlp-ingress:
    build:
      context: ../..
      dockerfile: infra/observability/otlp-ingress/Dockerfile
    restart: unless-stopped
    depends_on:
      - otel-gateway
    ports:
      - "0.0.0.0:${OTLP_TLS_PORT}:4317"
    environment:
      OTLP_INGRESS_LISTEN: ":4317"
      OTLP_INGRESS_TLS_CERT_FILE: /run/otlp-ingress/server.crt
      OTLP_INGRESS_TLS_KEY_FILE: /run/otlp-ingress/server.key
      OTLP_INGRESS_FLEET_ORIGIN: ${OTLP_INGRESS_FLEET_ORIGIN}
      OTLP_INGRESS_FLEET_CA_FILE: /run/otlp-ingress/fleet-ca.crt
      OTLP_INGRESS_FLEET_CLIENT_CERT_FILE: /run/otlp-ingress/fleet-client.crt
      OTLP_INGRESS_FLEET_CLIENT_KEY_FILE: /run/otlp-ingress/fleet-client.key
      OTLP_INGRESS_GATEWAY_ORIGIN: http://otel-gateway:4318
    volumes:
      - ${OTLP_INGRESS_CERT_DIR}:/run/otlp-ingress:ro
    networks:
      - observability

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
  
  grafana:
    image: ${GRAFANA_IMAGE}
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    ports:
      # Access through the Ubuntu host only: http://127.0.0.1:13000
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability

networks:
  observability:

volumes:
  prometheus-data:
  grafana-data:
